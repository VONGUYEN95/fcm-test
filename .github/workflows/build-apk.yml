name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable CI signing key
        uses: actions/cache@v4
        with:
          path: ci-signing
          key: fcmguard-stable-ci-signing-v1

      - name: Create stable CI signing key if missing
        run: |
          mkdir -p ci-signing
          if [ ! -f ci-signing/fcmguard-debug.keystore ]; then
            keytool -genkeypair \
              -keystore ci-signing/fcmguard-debug.keystore \
              -storepass android \
              -keypass android \
              -alias fcmguarddebug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FCM Guard Debug,O=Me,C=VN"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FCMGuard-HyperOS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCMGuard-debug-apk
          path: FCMGuard-HyperOS.apk
          retention-days: 30
